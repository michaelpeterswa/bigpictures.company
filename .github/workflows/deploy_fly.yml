---
name: Deploy to Fly

on: #  yamllint disable-line rule:truthy
  release:
    types:
      - created
  workflow_dispatch:

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    name: "Deploy web to Fly"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NEXT_PUBLIC_TILE_BASE_URL: ${{ vars.NEXT_PUBLIC_TILE_BASE_URL }}
        # Build context is the repo root because web/Dockerfile COPYs from
        # web/* paths. fly.toml at the root pins build.dockerfile to
        # web/Dockerfile, so this command just needs --remote-only and the
        # build-arg for NEXT_PUBLIC_*.
        run: |
          flyctl deploy --remote-only \
            --build-arg "NEXT_PUBLIC_TILE_BASE_URL=$NEXT_PUBLIC_TILE_BASE_URL"

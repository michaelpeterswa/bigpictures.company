name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "fly.toml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NEXT_PUBLIC_TILE_BASE_URL: ${{ vars.NEXT_PUBLIC_TILE_BASE_URL }}
        run: |
          flyctl deploy --remote-only \
            --build-arg "NEXT_PUBLIC_TILE_BASE_URL=$NEXT_PUBLIC_TILE_BASE_URL"
